# ── Stats Backfill (one-shot job) ─────────────────────────────────
quarkus.application.name=stats-backfill

# Database (reactive PG client — reads from the sales context, writes to its outbox)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:DRAGON}
quarkus.datasource.password=${DB_PASSWORD:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_SALES_HOST:localhost}:${DB_SALES_PORT:5432}/${DB_SALES_NAME:pos_sales}

# Disable HTTP server (one-shot job)
quarkus.http.port=-1

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# Transaction Service configuration
quarkus.log.level=INFO

# ── Transactional outbox (Fase 11) ─────────────────────────────────────
notification.transaction.email=${NOTIFICATION_TRANSACTION_EMAIL:admin@example.com}

# OutboxPublisher (transaction module)
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
outbox.publisher.interval-ms=${OUTBOX_PUBLISHER_INTERVAL_MS:5000}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:50}
outbox.publisher.max-attempts=${OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}

quarkus.grpc.server.port=9009
quarkus.http.port=8093
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.use-separate-server=true

quarkus.datasource.db-kind=postgresql
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.datasource.username=${DB_USERNAME:DRAGON}
quarkus.datasource.password=${DB_PASSWORD:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_SALES_HOST:localhost}:${DB_SALES_PORT:5432}/${DB_SALES_NAME:pos_sales}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_SALES_HOST:localhost}:${DB_SALES_PORT:5432}/${DB_SALES_NAME:pos_sales}

# ── Flyway (owner: pos_transaction) ──────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=public
quarkus.flyway.default-schema=public

# ── Hibernate ─────────────────────────────────────────────────────
quarkus.hibernate-orm.database.default-schema=public
quarkus.hibernate-orm.log.sql=false

# ── Test profile ──────────────────────────────────────────────────
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.default-schema=public

quarkus.grpc.clients.merchant.host=${MERCHANT_HOST:localhost}
quarkus.grpc.clients.merchant.port=${MERCHANT_GRPC_PORT:9005}

quarkus.grpc.clients.order.host=${ORDER_HOST:localhost}
quarkus.grpc.clients.order.port=${ORDER_GRPC_PORT:9001}

quarkus.grpc.clients.order_item.host=${ORDER_ITEM_HOST:localhost}
quarkus.grpc.clients.order_item.port=${ORDER_ITEM_GRPC_PORT:9016}

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.flyway.table=flyway_transaction_history

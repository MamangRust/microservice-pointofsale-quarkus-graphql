quarkus.http.port=8098
quarkus.http.host=0.0.0.0

quarkus.arc.remove-unused-beans=true

# ── Datasource (pos_email context) ────────────────────────────────────────
# Owns the consumer_inbox idempotency table. JDBC only (no Hibernate/Panache):
# Flyway drives the schema.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:DRAGON}
quarkus.datasource.password=${DB_PASSWORD:DRAGON}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_EMAIL_HOST:localhost}:${DB_EMAIL_PORT:5432}/${DB_EMAIL_NAME:pos_email}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=public
quarkus.flyway.default-schema=public

# Test: do not run Flyway / require a database
%test.quarkus.flyway.migrate-at-start=false

# Mailer configuration
quarkus.mailer.host=${SMTP_SERVER:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASS:}
quarkus.mailer.ssl=false
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.from=no-reply@payment-gateway.com

# ── Redis (email dedup guard, Fase 11) ────────────────────────────────────
quarkus.redis.hosts=${REDIS_HOSTS:redis://:dragon_knight@redis:6379}

# ── Retry / DLQ (Fase 11) ────────────────────────────────────────────────
email.retry.max-attempts=${EMAIL_RETRY_MAX_ATTEMPTS:3}
email.retry.base-backoff-ms=${EMAIL_RETRY_BASE_BACKOFF_MS:30000}

# ── Health checks (Phase 5) ──────────────────────────────────────────────
smtp.health.enabled=${SMTP_HEALTH_ENABLED:false}
smtp.health.timeout.ms=${SMTP_HEALTH_TIMEOUT_MS:3000}

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

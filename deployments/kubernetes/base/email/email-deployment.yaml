apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  namespace: pointofsale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      initContainers:
        - name: init-log-permission
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Setting ownership for /var/log/app"
              chown -R 1000:1000 /var/log/app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          securityContext:
            runAsUser: 0
        - name: wait-for-kafka
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for Kafka to be ready (TCP)..."
              until nc -z kafka.pointofsale.svc.cluster.local 9092; do
                echo "Kafka is not ready yet. Waiting 5 seconds..."
                sleep 5
              done
              echo "Kafka is ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: email
          image: quarkus-grpc-pointofsale/email:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
            # Fase 14 (K-6): truststore TLS broker Kafka (dari secret kafka-tls).
            - name: kafka-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
        - name: kafka-tls
          secret:
            secretName: kafka-tls
            optional: true

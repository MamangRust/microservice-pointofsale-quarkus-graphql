quarkus.grpc.server.port=9014
quarkus.http.port=8094
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.use-separate-server=true

quarkus.grpc.clients.merchant.host=${MERCHANT_HOST:localhost}
quarkus.grpc.clients.merchant.port=${MERCHANT_GRPC_PORT:9005}
quarkus.grpc.clients.user.host=${USER_GRPC_HOST:localhost}
quarkus.grpc.clients.user.port=${USER_GRPC_PORT:9011}

quarkus.datasource.db-kind=postgresql
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.datasource.username=${DB_USERNAME:DRAGON}
quarkus.datasource.password=${DB_PASSWORD:DRAGON}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_MERCHANT_HOST:localhost}:${DB_MERCHANT_PORT:5432}/${DB_MERCHANT_NAME:pos_merchant}
quarkus.datasource.reactive.url=postgresql://${DB_MERCHANT_HOST:localhost}:${DB_MERCHANT_PORT:5432}/${DB_MERCHANT_NAME:pos_merchant}

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

# ── Hibernate (non-owner: pos_merchant, validate only) ────────────
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=public
quarkus.hibernate-orm.log.sql=false

# ── Test profile ──────────────────────────────────────────────────
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.default-schema=public


# Disable Flyway - not a schema owner
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:nonexistent

quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=30
